spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/roadrescue_rating_db
    username: hemant_user
    password: roadrescuePass@48
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      show_sql: true
      format_sql: true
  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: reviewEvent:com.roadrescue.rating_service.dto.ReviewEvent
    topic:
      reviews-topic: reviews

server:
  port: 8089

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.roadrescue.rating_service: DEBUG
