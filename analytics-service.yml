spring:
  data:
    mongodb:
      uri: mongodb://hemant_user:roadrescuePass@48@localhost:27017/roadrescue_analytics_db?authSource=admin
  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: analytics-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >
          breakdownRequestEvent:com.roadrescue.analytics_service.dto.BreakdownRequestEvent,
          mechanicAssignmentEvent:com.roadrescue.analytics_service.dto.MechanicAssignmentEvent,
          serviceCompletionEvent:com.roadrescue.analytics_service.dto.ServiceCompletionEvent,
          paymentEvent:com.roadrescue.analytics_service.dto.PaymentEvent,
          reviewEvent:com.roadrescue.analytics_service.dto.ReviewEvent
      auto-offset-reset: earliest
    topic:
      breakdown-request-topic: breakdown-requests
      mechanic-assignment-topic: mechanic-assignments
      service-completion-topic: service-completion
      payments-topic: payments
      reviews-topic: reviews

server:
  port: 8088

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.roadrescue.analytics_service: DEBUG
