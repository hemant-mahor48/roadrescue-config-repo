spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000ms

  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: locationUpdateEvent:com.roadrescue.location_service.dto.LocationUpdateEvent
      acks: all
      retries: 3

    topic:
      location-updates-topic: location-updates

server:
  port: 8083

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.roadrescue.location_service: DEBUG

maps:
  google:
    distance-matrix:
      base-url: https://maps.googleapis.com
      api-key: ${GOOGLE_DISTANCE_MATRIX_API_KEY:}
