spring:
  kafka:
    bootstrap-servers: localhost:9093

    consumer:
      group-id: matching-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: breakdownRequestEvent:com.roadrescue.matching_service.dto.BreakdownRequestEvent
      auto-offset-reset: earliest

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: mechanicNotificationEvent:com.roadrescue.matching_service.dto.MechanicNotificationEvent
      acks: all
      retries: 3

    topic:
      breakdown-request-topic: breakdown-requests
      mechanic-notification-topic: mechanic-notifications
      mechanic-assignment-topic: mechanic-assignments
      mechanic-rejection-topic: mechanic-rejections

server:
  port: 8084

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.roadrescue.matching_service: DEBUG
    org.springframework.kafka: INFO